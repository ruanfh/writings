<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  mermaid.initialize({
    startOnLoad: false,
    theme: 'default'   // change to 'dark', 'neutral', 'forest', or 'base' if you want
  });

  // Convert Jekyll’s <code class="language-mermaid"> into real Mermaid diagrams
  document.querySelectorAll('pre > code.language-mermaid').forEach(code => {
    const pre = code.parentElement;
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent.trim();
    pre.replaceWith(div);
  });

  await mermaid.run();
</script>

<style>
  /* Optional: make the diagrams look cleaner */
  pre:has(code.language-mermaid),
  code.language-mermaid {
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
  }
  .mermaid {
    text-align: center;
    margin: 2rem 0;
  }
</style>
