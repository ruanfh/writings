<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>

    {% include head-custom.html %}
</head>

<body>
    <main>
        {{ content }}

        {% if page.copyright %}
        <footer
            style="margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.9em;">
            {{ page.copyright | escape }}
        </footer>
        {% endif %}
    </main>
</body>

</html>
